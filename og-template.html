<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>OG Image Template - Orion Private Class</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  *{ box-sizing: border-box; margin: 0; padding: 0; }
  body{ background: #0d1316; display: flex; justify-content: center; padding: 20px; }

  /* Ukuran tetap 1200x630 */
  .og{
    width: 1200px; height: 630px; flex-shrink: 0;
    background: #172226; color: #DCE8E9;
    font-family: 'Plus Jakarta Sans', sans-serif;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 80px; position: relative; overflow: hidden;
  }
  .og::before{ /* garis merah di bawah */
    content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 14px; background: #F32B2C;
  }
  .copy{ flex: 1; padding-right: 50px; }
  .tag{
    display: inline-block; font-size: 24px; font-weight: 600;
    border: 2px solid rgba(220,232,233,0.3); padding: 8px 22px; border-radius: 999px; margin-bottom: 34px;
  }
  h1{
    font-family: 'Orbitron', sans-serif; font-weight: 800; color: #fff;
    font-size: 66px; line-height: 1.12; margin-bottom: 26px;
  }
  h1 span{ color: #F32B2C; }
  p{ font-size: 28px; line-height: 1.5; color: rgba(220,232,233,0.8); max-width: 600px; }
  .price{
    display: inline-block; margin-top: 30px; background: #F32B2C; color: #fff;
    font-weight: 700; font-size: 26px; padding: 12px 26px; border-radius: 12px;
  }
  .logo{
    width: 330px; height: 330px; flex-shrink: 0; object-fit: contain;
    background: #DCE8E9; padding: 20px; border-radius: 36px; box-shadow: 16px 16px 0 #F32B2C;
  }
</style>
</head>
<body>

  <!-- Taruh file ini sejajar dengan image.jpg (logo) -->
  <div class="og" id="og">
    <div class="copy">
      <span class="tag">Pamekasan Kota</span>
      <h1>Orion<br>Private Class</h1>
      <p>Les privat TK, SD, SMP &amp; SMA. Tutor datang ke rumah atau belajar di lembaga.</p>
      <span class="price">Mulai Rp40.000</span>
    </div>
    <img class="logo" src="image.jpg" alt="Logo Orion Private Class">
  </div>

</body>
</html>
